name: Update F1 data & deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Fetch current season results
        run: python scripts/update_entries.py

      - name: Rebuild graph data (one JSON per graph)
        run: python scripts/build_data.py

      - name: Fetch photos for new drivers
        run: python scripts/fetch_photos.py

      - name: Fetch credits for new photos
        run: python scripts/fetch_photo_credits.py

      - name: Solve layout for every graph
        run: node scripts/layout.mjs

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
